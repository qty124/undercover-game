<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a1f" />
  <title>🕵️ 卧底风云 · 聚会版</title>
  <style>
    /* ========== 基础重置 ========== */
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      color: #f0f0ff;
      background: linear-gradient(135deg, #0a0a1f 0%, #1a0a2e 35%, #0d1b3a 70%, #0a0a1f 100%);
      background-attachment: fixed;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }
    body::before, body::after {
      content: ""; position: fixed;
      width: 50vmax; height: 50vmax;
      border-radius: 50%;
      filter: blur(120px); opacity: .35;
      pointer-events: none; z-index: 0;
    }
    body::before { background: #6a3ec9; top: -15vmax; left: -15vmax; }
    body::after  { background: #1e6dc9; bottom: -15vmax; right: -15vmax; }

    .hidden { display: none !important; }

    .container {
      position: relative; z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 18px 60px;
    }
    header { text-align: center; margin-bottom: 26px; }
    h1 {
      font-size: clamp(28px, 6vw, 42px);
      letter-spacing: 2px;
      text-shadow: 0 0 24px rgba(160, 120, 255, .6);
    }
    .subtitle {
      margin-top: 8px;
      color: #b6b6d8;
      font-size: 14px;
    }

    /* ========== 按钮 ========== */
    .btn {
      cursor: pointer;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.06);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #f0f0ff;
      padding: 11px 22px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1px;
      transition: transform .15s ease, box-shadow .25s ease, background .25s ease;
      box-shadow: 0 0 14px rgba(120, 100, 220, .25);
      font-family: inherit;
    }
    .btn:hover:not(:disabled) { transform: translateY(-1px); background: rgba(255,255,255,.12); }
    .btn:active:not(:disabled) { transform: translateY(0); }
    .btn:disabled { opacity: .35; cursor: not-allowed; }
    .btn.primary {
      background: linear-gradient(135deg, #4c1d95, #6d28d9);
      border-color: transparent;
      box-shadow: 0 0 22px rgba(120, 80, 220, .55);
    }
    .btn.primary:hover { box-shadow: 0 0 32px rgba(150, 100, 255, .75); }
    .btn.orange { background: linear-gradient(135deg, #b45309, #f59e0b); border-color: transparent; }
    .btn.danger { background: linear-gradient(135deg, #c9364a, #7a1e2c); }
    .btn.reset  { background: linear-gradient(135deg, #1ec97e, #1e6dc9); border-color: transparent; }
    .btn.muted  { background: rgba(120,80,220,.15); border-color: rgba(160,120,255,.35); }
    .btn.muted.my-vote {
      background: rgba(255,224,112,0.18);
      border-color: rgba(255,224,112,0.55);
      color: #ffe070;
    }
    .btn-count {
      width: 56px; height: 56px;
      padding: 0;
      font-size: 22px;
      border-radius: 18px;
    }
    .btn-count.active {
      background: linear-gradient(135deg, #4c1d95, #6d28d9);
      border-color: transparent;
      box-shadow: 0 0 22px rgba(120,80,220,.55);
    }

    /* ========== 设置阶段 ========== */
    .setup-card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 24px;
      padding: 32px 26px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 30px rgba(160,120,255,0.2);
      max-width: 600px; margin: 0 auto 24px;
    }
    .setup-card h2 {
      font-size: 18px;
      letter-spacing: 2px;
      color: #d8d8ff;
      margin-bottom: 14px;
      text-align: center;
    }
    .count-picker {
      display: flex; gap: 8px; justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }
    .name-inputs {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }
    .name-inputs input {
      width: 100%;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,.18);
      color: #fff;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 14px;
      outline: none;
      font-family: inherit;
    }
    .name-inputs input:focus { border-color: rgba(160,120,255,0.7); box-shadow: 0 0 0 3px rgba(160,120,255,0.18); }

    /* ========== 卡牌 ========== */
    .cards {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 10px;
      margin-bottom: 22px;
    }
    .cards.cols-3 { grid-template-columns: repeat(3, 1fr); }
    .cards.cols-4 { grid-template-columns: repeat(4, 1fr); }
    .cards.cols-5 { grid-template-columns: repeat(5, 1fr); }
    .cards.cols-6 { grid-template-columns: repeat(6, 1fr); }
    .cards.cols-7 { grid-template-columns: repeat(7, 1fr); }
    @media (max-width: 720px) {
      .cards, .cards.cols-3, .cards.cols-4,
      .cards.cols-5, .cards.cols-6, .cards.cols-7 { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 480px) {
      .cards, .cards.cols-3, .cards.cols-4,
      .cards.cols-5, .cards.cols-6, .cards.cols-7 { grid-template-columns: repeat(3, 1fr); }
    }
    .card {
      position: relative;
      aspect-ratio: 2 / 3;
      min-height: 150px;
      perspective: 1000px;
      cursor: default;
    }
    .card.clickable { cursor: pointer; }
    .card-inner {
      position: absolute; inset: 0;
      transform-style: preserve-3d;
      transition: transform .7s cubic-bezier(.4,.0,.2,1);
      border-radius: 16px;
    }
    .card.flipped .card-inner { transform: rotateY(180deg); }
    .card-face {
      position: absolute; inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 16px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 10px;
      text-align: center;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 8px 32px rgba(0,0,0,.4), inset 0 0 24px rgba(255,255,255,0.05);
    }
    .card-back {
      background: linear-gradient(135deg, rgba(120,80,220,.18), rgba(30,109,201,.18));
    }
    .card-back .emoji { font-size: clamp(30px, 6vw, 50px); margin-bottom: 4px; }
    .card-back .label { font-size: clamp(12px, 2.6vw, 15px); color: #d0d0ff; letter-spacing: 1px; word-break: break-all; }
    .card-back .hint  { font-size: 10px; color: #9999c8; margin-top: 4px; }
    .card-front { transform: rotateY(180deg); color: #fff; font-weight: 700; }
    .card-front.civilian { background: rgba(37, 99, 235, 0.85); border-color: rgba(100,180,255,0.5); }
    .card-front.spy { background: rgba(220, 38, 38, 0.85); border-color: rgba(255,120,140,0.5); }
    .card-front.locked {
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.18);
      color: #8a8ab0;
    }
    .card-front.eliminated {
      background: rgba(120,120,140,0.35);
      border-color: rgba(255,80,80,0.55);
      color: #ffcfcf;
    }
    .card-front .role-tag {
      font-size: 12px; padding: 4px 10px;
      border-radius: 999px;
      background: rgba(0,0,0,.25);
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    .card-front .word {
      font-size: clamp(15px, 3.5vw, 22px);
      word-break: break-all;
      line-height: 1.25;
    }
    .card-front.locked .word { font-size: clamp(20px, 5vw, 30px); color: #6a6a8c; }
    .card-front .spy-icon { font-size: clamp(34px, 7vw, 50px); margin-bottom: 6px; }
    .card-front .spy-text { font-size: clamp(12px, 2.8vw, 14px); }
    .card-front .eliminated-tag {
      font-size: 11px; padding: 3px 8px;
      border-radius: 999px;
      background: rgba(220,38,38,0.4);
      border: 1px solid rgba(255,80,80,0.6);
      margin-top: 8px;
      letter-spacing: 1px;
    }
    .card .vote-badge {
      position: absolute;
      top: 8px; right: 8px;
      min-width: 28px; height: 28px;
      padding: 0 8px;
      border-radius: 999px;
      background: linear-gradient(135deg, #f59e0b, #b45309);
      color: #fff; font-weight: 800; font-size: 13px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 12px rgba(245,158,11,0.6);
      z-index: 4;
    }

    /* ========== 投票/猜词区 ========== */
    .action-area {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 14px;
      margin-bottom: 22px;
    }
    @media (max-width: 720px) { .action-area { grid-template-columns: 1fr; } }
    .panel {
      background: rgba(255,255,255,.05);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px;
      padding: 16px;
    }
    .panel h2 { color: #d8d8ff; font-size: 15px; margin-bottom: 10px; letter-spacing: 1px; }
    .vote-row {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 8px;
    }
    .vote-row .btn { padding: 9px 6px; font-size: 13px; }
    .guess-row { display: flex; gap: 8px; }
    .guess-row input {
      flex: 1; min-width: 0;
      background: rgba(0,0,0,.35);
      border: 1px solid rgba(255,255,255,.18);
      color: #fff;
      padding: 11px 14px;
      border-radius: 999px;
      font-size: 15px;
      outline: none;
      font-family: inherit;
    }
    .guess-row input:focus { border-color: rgba(160,120,255,0.7); box-shadow: 0 0 0 3px rgba(160,120,255,0.18); }
    .guess-locked {
      text-align: center;
      padding: 28px 14px;
      color: #7a7a9c;
      font-size: 13px;
      line-height: 1.6;
      background: rgba(0,0,0,0.18);
      border-radius: 14px;
      border: 1px dashed rgba(255,255,255,0.08);
    }
    .panel-hint {
      font-size: 12px; color: #9999c8;
      margin-top: 10px; line-height: 1.5;
    }
    .slot-summary {
      font-size: 12px; color: #9999c8;
      letter-spacing: 1px; font-weight: 400;
    }

    .status {
      text-align: center;
      color: #b6b6d8;
      font-size: 14px;
      letter-spacing: 1px;
      min-height: 22px;
      margin-bottom: 14px;
    }

    .control-bar {
      display: flex; justify-content: center; gap: 12px;
      flex-wrap: wrap;
    }

    /* ========== 弹窗 ========== */
    .modal-mask {
      position: fixed; inset: 0;
      background: rgba(5, 5, 20, .65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center; justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-mask.show { display: flex; animation: fadeIn .25s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal {
      max-width: 400px; width: 100%;
      background: linear-gradient(135deg, rgba(40,20,80,.92), rgba(20,40,90,.92));
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 22px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 24px 64px rgba(0,0,0,.55), 0 0 40px rgba(160,120,255,.4);
      animation: pop .35s cubic-bezier(.2,.9,.3,1.2);
    }
    @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .modal .emoji { font-size: 56px; margin-bottom: 10px; }
    .modal h3 {
      font-size: 24px; letter-spacing: 2px; margin-bottom: 8px;
      text-shadow: 0 0 16px rgba(160,120,255,.6);
    }
    .modal.civilian-win h3 { color: #6fc3ff; }
    .modal.spy-win h3      { color: #ff6f8c; }
    .modal p { color: #c8c8e8; font-size: 14px; line-height: 1.6; margin-bottom: 14px; }
    .modal .reveal {
      background: rgba(0,0,0,.35);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 16px;
      font-size: 13px;
      color: #d8d8ff;
      text-align: left;
      line-height: 1.7;
    }
    .modal .reveal .word { color: #ffe070; font-weight: 700; font-size: 16px; }
    .modal .reveal .spy-name { color: #ff9aa8; font-weight: 700; }
    .modal .modal-hint {
      font-size: 12px !important;
      color: #7a7a9c !important;
      margin-bottom: 0 !important;
      margin-top: 10px !important;
    }

    footer {
      text-align: center;
      margin-top: 28px;
      color: #7a7a9c;
      font-size: 12px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🕵️ 卧底风云</h1>
      <p class="subtitle">聚会现场版 · 同设备轮流玩 · 跨设备请用联机版</p>
    </header>

    <!-- ========== 设置阶段 ========== -->
    <div id="setupSection">
      <div class="setup-card">
        <h2>🎮 开局设置</h2>
        <div class="count-picker" id="countPicker">
          <!-- JS 生成 3-8 -->
        </div>
        <div class="name-inputs" id="nameInputs">
          <!-- JS 按选定人数生成 -->
        </div>
        <button class="btn primary" id="startBtn" style="width:100%;padding:14px;">🚀 开始本局</button>
      </div>
    </div>

    <!-- ========== 游戏阶段 ========== -->
    <div id="playSection" class="hidden">
      <div class="cards" id="cards"></div>
      <p class="status" id="status">准备中...</p>

      <div class="action-area">
        <div class="panel">
          <h2>🗳️ 投票出卧底 <span id="voteMeta" class="slot-summary"></span></h2>
          <div class="vote-row" id="voteRow"></div>
          <p class="panel-hint">每人 1 票，可改投。得票数 <strong>超过</strong>在场人数一半的玩家会被票出并判定胜负。</p>
        </div>

        <div class="panel">
          <h2>🕵️ 间谍猜词</h2>
          <div id="guessArea"><!-- JS 渲染 --></div>
          <p class="panel-hint">只有 <strong>卧底</strong> 才能猜词；猜中平民的词即胜。</p>
        </div>
      </div>

      <div class="control-bar">
        <button class="btn reset" id="resetBtn">🔄 再来一局</button>
        <button class="btn muted" id="clearVoteBtn">🧹 清空票数重新投</button>
        <button class="btn danger" id="backToSetup">🚪 退出到设置</button>
      </div>

      <footer>👥 <strong>规则速览：</strong>3-8 人动态开局 · 每 5 人中 1 个卧底 · 投票需过半数才算出局 · 仅卧底可猜词</footer>
    </div>
  </div>

  <!-- ========== 结果弹窗 ========== -->
  <div class="modal-mask" id="modal">
    <div class="modal" id="modalBody">
      <div class="emoji" id="modalEmoji">🎉</div>
      <h3 id="modalTitle">平民胜利！</h3>
      <p id="modalDesc">你们成功揪出了间谍！</p>
      <div class="reveal" id="modalReveal">
        本局词语：<span class="word" id="modalWord">—</span><br/>
        间谍是：<strong id="modalSpy">玩家 ?</strong>
      </div>
      <button class="btn reset" id="modalReset">🔄 再来一局</button>
      <p class="modal-hint">或点击弹窗外空白处关闭</p>
    </div>
  </div>

  <script>
    // ========== 词库 ==========
    const WORDS = [
      // 食物 (20)
      "饺子","包子","馒头","粽子","月饼","汤圆","烧麦","春卷","煎饼","油条",
      "豆浆","米饭","拉面","火锅","烧烤","麻辣烫","披萨","汉堡","三明治","寿司",
      // 水果 (15)
      "苹果","香蕉","橙子","葡萄","西瓜","哈密瓜","草莓","蓝莓","樱桃","桃子",
      "梨","菠萝","芒果","猕猴桃","火龙果",
      // 动物 (15)
      "猫","狗","兔子","仓鼠","龙猫","鹦鹉","金鱼","乌龟","鸭子","大鹅",
      "公鸡","绵羊","山羊","奶牛","熊猫",
      // 日常 (15)
      "手机","电脑","平板","耳机","充电宝","雨伞","钥匙","钱包","手表","眼镜",
      "水杯","保温杯","牙刷","毛巾","枕头",
      // 场所 (15)
      "学校","医院","超市","商场","公园","图书馆","电影院","体育馆","游泳池","博物馆",
      "火车站","机场","地铁站","餐厅","咖啡店",
      // 其他 (20)
      "篮球","足球","乒乓球","羽毛球","网球","排球","钢琴","吉他",
      "太阳","月亮","星星","雨伞","蜡烛","闹钟","台灯","吹风机","梳子","雨鞋"
    ];
    const MIN_PLAYERS = 3;
    const MAX_PLAYERS = 8;

    // ========== 全局状态 ==========
    let state = null;  // 见下文 buildGameState()

    function spyCountByN(n) {
      // ceil(n/5): 3-5→1, 6-10→2, ...
      return Math.max(1, Math.ceil(n / 5));
    }
    function pickWord() { return WORDS[Math.floor(Math.random() * WORDS.length)]; }
    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }
    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function buildGameState(n, names) {
      const order = shuffle([...Array(n).keys()]);
      const spyN = spyCountByN(n);
      const spyIndices      = order.slice(0, spyN);
      const civilianIndices = order.slice(spyN);
      return {
        n,
        names,
        word: pickWord(),
        spyIndices,
        civilianIndices,
        flipped: new Array(n).fill(false),
        votes: {},          // voterIndex -> targetIndex
        gameOver: false,
        winner: null,
        endMode: null,      // "vote" | "spyGuess" | "noEliminate"
        endData: null
      };
    }

    // ========== DOM 引用 ==========
    const $setupSection = document.getElementById("setupSection");
    const $playSection  = document.getElementById("playSection");
    const $countPicker  = document.getElementById("countPicker");
    const $nameInputs   = document.getElementById("nameInputs");
    const $startBtn     = document.getElementById("startBtn");
    const $cards        = document.getElementById("cards");
    const $status       = document.getElementById("status");
    const $voteRow      = document.getElementById("voteRow");
    const $voteMeta     = document.getElementById("voteMeta");
    const $guessArea    = document.getElementById("guessArea");
    const $resetBtn     = document.getElementById("resetBtn");
    const $clearVoteBtn = document.getElementById("clearVoteBtn");
    const $backToSetup  = document.getElementById("backToSetup");
    const $modal        = document.getElementById("modal");
    const $modalBody    = document.getElementById("modalBody");
    const $modalEmoji   = document.getElementById("modalEmoji");
    const $modalTitle   = document.getElementById("modalTitle");
    const $modalDesc    = document.getElementById("modalDesc");
    const $modalReveal  = document.getElementById("modalReveal");
    const $modalWord    = document.getElementById("modalWord");
    const $modalSpy     = document.getElementById("modalSpy");
    const $modalReset   = document.getElementById("modalReset");

    let myVote = null;  // 当前局本地投票状态 (key: voter index)

    // ========== 设置阶段 ==========
    let chosenCount = 5;

    function renderCountPicker() {
      $countPicker.innerHTML = "";
      for (let i = MIN_PLAYERS; i <= MAX_PLAYERS; i++) {
        const b = document.createElement("button");
        b.className = "btn btn-count" + (i === chosenCount ? " active" : "");
        b.textContent = String(i);
        b.addEventListener("click", () => {
          chosenCount = i;
          renderCountPicker();
          renderNameInputs();
        });
        $countPicker.appendChild(b);
      }
    }

    function renderNameInputs() {
      const current = $nameInputs.children.length;
      // 只在数量变化时重建输入框, 防止 name 内容丢失
      if (current === chosenCount) {
        // 只更新 prefix
        Array.from($nameInputs.children).forEach((inp, i) => {
          inp.previousSibling?.remove?.();
        });
        $nameInputs.innerHTML = "";
        for (let i = 0; i < chosenCount; i++) {
          addNameInput(i);
        }
        return;
      }
      // 先读出旧值
      const old = Array.from($nameInputs.querySelectorAll("input")).map(i => i.value);
      $nameInputs.innerHTML = "";
      for (let i = 0; i < chosenCount; i++) {
        addNameInput(i, old[i] || "");
      }
    }
    function addNameInput(i, prevVal = "") {
      const wrap = document.createElement("div");
      wrap.style.position = "relative";
      const prefix = document.createElement("span");
      prefix.style.cssText = "position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:11px;color:#7a7a9c;letter-spacing:1px;pointer-events:none;";
      prefix.textContent = "P" + (i + 1);
      const inp = document.createElement("input");
      inp.type = "text"; inp.maxLength = 8;
      inp.placeholder = "玩家 " + (i + 1) + " (留空默认)";
      inp.value = prevVal;
      inp.style.paddingLeft = "36px";
      wrap.appendChild(prefix);
      wrap.appendChild(inp);
      $nameInputs.appendChild(wrap);
    }

    function startGame() {
      const names = Array.from($nameInputs.querySelectorAll("input"))
        .map(i => i.value.trim() || "");
      state = buildGameState(chosenCount, names);
      myVote = null;
      $setupSection.classList.add("hidden");
      $playSection.classList.remove("hidden");
      $modal.classList.remove("show");
      render();
    }

    function backToSetup() {
      if (!confirm("退出当前局回到设置？已分配的词语和投票会丢失。")) return;
      state = null;
      myVote = null;
      $modal.classList.remove("show");
      $setupSection.classList.remove("hidden");
      $playSection.classList.add("hidden");
    }

    // ========== 翻牌 ==========
    function flipCard(i) {
      if (!state || state.gameOver) return;
      if (state.flipped[i]) return;
      state.flipped[i] = true;
      render();
    }

    // ========== 投票 ==========
    function doVote(target) {
      if (!state || state.gameOver) return;
      myVote = target;
      // voter 本人在投票面板上没自己的按钮
      // 简化: 直接存到 state
      state.votes["local"] = target;  // 单机版: 不区分 voter, 反正这是 1 票
      // 但单机版逻辑有点不同… 见下方注释
      render();
      // 投票后立即检查是否所有人都投完, 不行 — 单机版每人 1 票, 这里用按钮轮换模拟
    }

    // 单机版本"所有人投票"的处理:
    // 我们用一个投票小流程: 点击"开始投票轮"按钮 → 然后依次让你为每个玩家投票 (为每人 1 票, 从某人开始)
    // 然后存为 votes[voterIdx] = targetIdx

    // 重做: 单机版很特殊 — 没有"我"的概念, 我们要顺序收集每位玩家的投票
    // 用一个 votingFlow 状态来管理

    let votingFlow = null;  // { nextVoter: number, targetMode: 'witness' }

    // 玩家按下"开始投票轮"按钮 (panel-hint 提供)
    // 然后循环: 为每位玩家询问"你投谁?"
    // 简化: 用 confirm() 询问每一位 (适用于 3-8 人)

    // 我决定改 UI: 投票面板改为 "投票轮次"模式.
    // 1. 状态: WAITING_TO_VOTE | VOTING_PLAYER_I | ALL_VOTED
    // 2. 显示 "🎯 开始投票轮" 按钮 → 进入 VOTE_FOR_PLAYER_0
    // 3. 此时投票按钮: "作为玩家 X 你投谁?", 显示其他玩家按钮
    // 4. 点完后自动 VOTE_FOR_PLAYER_(X+1)
    // 5. 全员投完 → 自动结算

    function renderVotePanel() {
      $voteRow.innerHTML = "";
      const N = state.n;
      const votedCount = Object.keys(state.votes).length;

      if (state.gameOver) {
        const btn = document.createElement("button");
        btn.className = "btn muted"; btn.disabled = true;
        btn.textContent = "游戏已结束";
        $voteRow.appendChild(btn);
        return;
      }

      if (!votingFlow) {
        // 未开始投票 (所有人尚未投完, 也未开始)
        if (votedCount === 0) {
          const btn = document.createElement("button");
          btn.className = "btn primary";
          btn.textContent = "🎯 开始投票轮";
          btn.style.gridColumn = "1 / -1";
          btn.addEventListener("click", () => {
            votingFlow = { nextVoter: 0 };
            render();
          });
          $voteRow.appendChild(btn);
        } else {
          // 投票轮到一半 (中途刷新?): 提供"继续"按钮
          const btn = document.createElement("button");
          btn.className = "btn primary";
          btn.textContent = `▶️ 继续投票 (${votedCount}/${N})`;
          btn.style.gridColumn = "1 / -1";
          btn.addEventListener("click", () => {
            // 计算下一个 voter: 已投票人数 = nextVoter 实际位置
            const votedKeys = Object.keys(state.votes).map(k => parseInt(k)).sort((a,b) => a - b);
            let next = 0;
            for (const v of votedKeys) {
              if (v === next) next = v + 1;
              else break;
            }
            votingFlow = { nextVoter: next };
            render();
          });
          $voteRow.appendChild(btn);
        }
        return;
      }

      // votingFlow 进行中
      const i = votingFlow.nextVoter;
      $voteRow.innerHTML = "";
      const label = document.createElement("div");
      label.style.cssText = "grid-column:1/-1;font-size:12px;color:#9999c8;text-align:center;";
      label.innerHTML = `👤 <strong>${escapeHtml(nameOf(i))}</strong> 在投票 (${i + 1}/${N})`;
      $voteRow.appendChild(label);

      for (let t = 0; t < N; t++) {
        if (t === i) continue;
        const btn = document.createElement("button");
        btn.className = "btn muted";
        btn.textContent = "投 " + nameOf(t);
        btn.addEventListener("click", () => castVote(i, t));
        $voteRow.appendChild(btn);
      }
    }

    function castVote(voter, target) {
      if (!state || state.gameOver) return;
      state.votes[voter] = target;
      // 推进
      if (votingFlow && votingFlow.nextVoter === voter) {
        if (voter + 1 >= state.n) {
          votingFlow = null;
        } else {
          votingFlow.nextVoter = voter + 1;
        }
      }
      render();
      maybeFinalizeVote();
    }

    function clearAllVotes() {
      if (!state) return;
      if (!confirm("清空所有票，重新投票吗？")) return;
      state.votes = {};
      votingFlow = null;
      render();
    }

    function maybeFinalizeVote() {
      if (!state || state.gameOver) return;
      const N = state.n;
      const votedCount = Object.keys(state.votes).length;
      if (votedCount < N) return;
      const tally = computeTally(state.votes);
      const verdict = judgeTally(tally, N);

      if (verdict && verdict.eliminated != null) {
        const wasSpy = state.spyIndices.includes(verdict.eliminated);
        state.gameOver = true;
        state.winner   = wasSpy ? "civilian" : "spy";
        state.endMode  = "vote";
        state.endData  = { eliminated: verdict.eliminated, threshold: verdict.threshold, topCount: verdict.topCount };
        render();
        showResultModal();
      } else if (verdict && verdict.tied) {
        alert("出现平票，请重新投票！");
        state.votes = {};
        votingFlow = null;
        render();
      } else {
        state.gameOver = true;
        state.winner   = "spy";
        state.endMode  = "noEliminate";
        state.endData  = verdict || {};
        render();
        showResultModal();
      }
    }

    function computeTally(votes) {
      const counts = {};
      for (const target of Object.values(votes)) {
        counts[target] = (counts[target] || 0) + 1;
      }
      return { counts };
    }
    function judgeTally(tally, n) {
      if (!tally) return null;
      const entries = Object.entries(tally.counts).filter(([, c]) => c > 0);
      if (entries.length === 0) return null;
      entries.sort((a, b) => b[1] - a[1]);
      const [topTarget, topCount] = entries[0];
      const threshold = n / 2;
      const isTie = entries.length > 1 && entries[1][1] === topCount;
      if (isTie) return { tied: true, threshold, topCount, topTarget: parseInt(topTarget, 10) };
      if (topCount > threshold) return {
        eliminated: parseInt(topTarget, 10),
        threshold,
        topCount,
        tied: false
      };
      return { eliminated: null, threshold, topCount, topTarget: parseInt(topTarget, 10), tied: false };
    }

    function nameOf(i) {
      const nm = state.names[i];
      return nm && nm.length ? nm : `玩家 ${i + 1}`;
    }

    // ========== 间谍猜词 ==========
    function renderGuessArea() {
      if (!state) return;
      const isSpy = state.spyIndices.includes(0);  // 单机无"我的索引"概念 — 改为全局可用但显示提示
      // 单机版特殊处理: 没有"我"的身份，但我们仍然根据"游戏设计者设定", 让所有玩家都可以尝试猜词
      // —— 不, 需求说只有卧底能猜. 单机版我们允许选一个"卧底代表"来猜词.
      // 简化: 暴露一个 checkbox 让玩家选择"我是卧底"——太粗暴.
      // 更好: 进入"猜词模式"前显示"只有卧底能进入猜词" 提示, 卧底自己点. 这是合理约.
      if (state.gameOver) {
        $guessArea.innerHTML = `<div class="guess-locked">— 游戏已结束 —</div>`;
        return;
      }
      $guessArea.innerHTML = `
        <div class="guess-locked">🔒 仅 <strong>卧底</strong> 可用<br/>
          <span style="font-size:11px;color:#6a6a8c;">下方按钮由卧底本人点击激活</span></div>
        <div style="margin-top:10px;">
          <button class="btn orange" id="guessReveal">🕵️ 我是卧底，开始猜词</button>
        </div>
      `;
      document.getElementById("guessReveal").addEventListener("click", () => {
        if (!confirm("确认你是卧底？(误点会让猜词角色错位)")) return;
        $guessArea.innerHTML = `
          <div class="guess-row">
            <input type="text" id="guessInput" placeholder="卧底在此输入猜测的词语…" maxlength="20" />
            <button class="btn orange" id="guessBtn">猜！</button>
          </div>
        `;
        document.getElementById("guessBtn").addEventListener("click", spyGuess);
        document.getElementById("guessInput").addEventListener("keydown", e => { if (e.key === "Enter") spyGuess(); });
      });
    }

    function spyGuess() {
      if (!state || state.gameOver) return;
      const inp = document.getElementById("guessInput");
      if (!inp) return;
      const guess = inp.value.trim();
      if (!guess) { alert("请先输入猜测的词语～"); return; }
      const win = (guess === state.word);
      state.gameOver = true;
      state.winner   = win ? "spy" : "civilian";
      state.endMode  = "spyGuess";
      state.endData  = { guess };
      render();
      showResultModal();
    }

    // ========== 渲染主入口 ==========
    function render() {
      renderCards();
      renderStatus();
      renderVotePanel();
      renderGuessArea();
      renderControls();
    }

    function renderCards() {
      if (!state) return;
      const N = state.n;
      const cols = Math.min(8, Math.max(3, N));
      $cards.className = "cards cols-" + cols;
      $cards.innerHTML = "";

      const isGameOver = state.gameOver;
      const spySet = new Set(state.spyIndices);
      const tally = computeTally(state.votes);
      const eliminatedIdx = (isGameOver && state.endData && state.endData.eliminated != null)
        ? state.endData.eliminated : null;

      for (let i = 0; i < N; i++) {
        const isSpy = spySet.has(i);
        const flipped = state.flipped[i];
        const showVoteBadge = tally.counts[i] > 0 && !isGameOver;
        const showContent = isGameOver || flipped;
        const wasEliminated = (eliminatedIdx === i);

        const card = document.createElement("div");
        card.className = "card" +
                         (showContent ? " flipped" : "") +
                         ((!isGameOver && !flipped) ? " clickable" : "");
        card.innerHTML = `
          <div class="card-inner">
            <div class="card-face card-back">
              <div class="emoji">🎴</div>
              <div class="label">${escapeHtml(nameOf(i))}</div>
              <div class="hint">${
                isGameOver ? "已结束" :
                flipped      ? "已查阅 ✓" :
                "点击翻开"
              }</div>
            </div>
            <div class="card-face card-front ${
              showContent
                ? (wasEliminated ? 'eliminated ' : '') + (isSpy ? 'spy' : 'civilian')
                : 'locked'
            }">
              ${
                showContent
                  ? (isSpy
                      ? `<div class="spy-icon">🕵️</div>
                         <div class="role-tag">间谍</div>
                         <div class="spy-text">空纸条</div>
                         ${wasEliminated ? '<div class="eliminated-tag">已被票出</div>' : ''}`
                      : `<div class="role-tag">平民</div>
                         <div class="word">${escapeHtml(state.word)}</div>
                         ${wasEliminated ? '<div class="eliminated-tag">已被票出</div>' : ''}`)
                  : `<div class="role-tag">🔒</div>
                     <div class="word">???</div>`
              }
            </div>
          </div>
          ${showVoteBadge ? `<div class="vote-badge">${tally.counts[i]}</div>` : ""}
        `;

        if (!isGameOver && !flipped) {
          card.addEventListener("click", () => flipCard(i));
        }
        $cards.appendChild(card);
      }
    }

    function renderStatus() {
      if (!state) return;
      const N = state.n;
      if (state.gameOver) {
        const cw = state.winner === "civilian";
        $status.textContent = cw ? "🎉 平民胜利！" : "💀 间谍胜利！";
        $status.style.color = cw ? "#6fc3ff" : "#ff6f8c";
        return;
      }
      const flippedCount = state.flipped.filter(f => f).length;
      const votedCount = Object.keys(state.votes).length;
      if (flippedCount < N) {
        $status.textContent = `👆 请大家轮流点开自己的卡牌查看身份 (${flippedCount}/${N})`;
      } else if (votedCount < N) {
        $status.textContent = `🗳️ 投票进行中 (${votedCount}/${N}) · 得票数 > ${(N / 2).toFixed(1)} 才算出局`;
      } else {
        $status.textContent = "📊 投票完成，等待结算中…";
      }
      $status.style.color = "#b6b6d8";
    }

    function renderControls() {
      if (!state) return;
      const N = state.n;
      const votedCount = Object.keys(state.votes).length;
      const isGameOver = state.gameOver;
      $voteMeta.textContent = isGameOver ? "" : `· 已投 ${votedCount}/${N}`;
      $clearVoteBtn.disabled = isGameOver || votedCount === 0;
    }

    function showResultModal() {
      if (!state) return;
      const cw = state.winner === "civilian";
      let title, desc, emoji;
      const data = state.endData || {};
      const eliminatedName = data.eliminated != null ? nameOf(data.eliminated) : "无";

      if (state.endMode === "spyGuess") {
        if (cw) { emoji = "🎉"; title = "平民胜利！"; desc = "间谍猜错了词，身份暴露！"; }
        else    { emoji = "💀"; title = "间谍胜利！"; desc = "卧底猜中了平民的词，绝地翻盘！"; }
      } else if (state.endMode === "noEliminate") {
        emoji = "💀"; title = "间谍胜利！";
        desc = data && data.tied ? "出现平票，没人被票出，间谍成功潜伏。" : "没人得票过半，间谍成功潜伏。";
      } else {
        // vote
        emoji = cw ? "🎉" : "💀";
        title = cw ? "平民胜利！" : "间谍胜利！";
        const wasSpy = state.spyIndices.includes(data.eliminated);
        if (wasSpy) desc = `你们成功揪出了间谍 (${eliminatedName})，词保住了！`;
        else        desc = `很遗憾，${eliminatedName} 是被冤票的平民，间谍隐藏在了你们当中。`;
      }

      $modalBody.className = "modal " + (cw ? "civilian-win" : "spy-win");
      $modalEmoji.textContent = emoji;
      $modalTitle.textContent = title;
      $modalDesc.textContent  = desc;

      const spyNames = state.spyIndices.map(i => nameOf(i)).join("、");
      $modalReveal.innerHTML = `
        本局词语：<span class="word">${escapeHtml(state.word)}</span><br/>
        平民人数：${state.n - state.spyIndices.length} 人<br/>
        卧底是：<strong class="spy-name">${escapeHtml(spyNames)}</strong>
      `;
      $modal.classList.add("show");
    }

    // ========== 事件绑定 ==========
    $startBtn.addEventListener("click", startGame);
    $resetBtn.addEventListener("click", () => {
      if (!state) return;
      if (!confirm("开始新的一局？(玩家人数不变, 重置角色和票数)")) return;
      const names = state.names;
      const N = state.n;
      state = buildGameState(N, names);
      myVote = null;
      votingFlow = null;
      $modal.classList.remove("show");
      render();
    });
    $clearVoteBtn.addEventListener("click", clearAllVotes);
    $backToSetup.addEventListener("click", backToSetup);
    $modalReset.addEventListener("click", () => {
      if (!state) return;
      const names = state.names; const N = state.n;
      state = buildGameState(N, names);
      votingFlow = null;
      $modal.classList.remove("show");
      render();
    });
    $modal.addEventListener("click", e => {
      if (e.target === $modal) $modal.classList.remove("show");
    });

    // ========== 初始化 ==========
    renderCountPicker();
    renderNameInputs();
  </script>
</body>
</html>
